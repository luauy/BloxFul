name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Ensure the local environment matches our modern compiler engine requirements
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # STEP 1: Deploy verified Gradle 8.14.5 tooling globally to the runner container
    - name: Install Verified Gradle 8.14.5 Toolchain
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.5'

    # STEP 2: Generate perfect wrapper layers directly inside the true project folder
    - name: Dynamically Regenerate Modern Wrapper Binaries
      working-directory: ./BloxFul
      run: |
        echo "Generating wrapper inside the true Android folder layout..."
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.14.5 --distribution-type bin

    # STEP 3: Grant shell script execution flags to the active wrapper path
    - name: Grant Shell Execution Rights
      working-directory: ./BloxFul
      run: chmod +x ./gradlew

    # STEP 4: Fire the compiler engine targeting the correct subdirectory path
    - name: Compile and Assemble Debug APK
      working-directory: ./BloxFul
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    # STEP 5: Grab the compiled engine package and upload it directly to your dashboard
    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: BloxFul/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        if-no-files-found: error
