name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # CRITICAL FIX: Installs a temporary global toolchain to natively construct a healthy wrapper binary
    - name: Dynamically Regenerate Missing Gradle Wrapper
      run: |
        echo "Creating wrapper destination directories..."
        mkdir -p gradle/wrapper
        
        echo "Provisioning official wrapper distribution configuration..."
        cat << EOF > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.2-bin.zip
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        echo "Installing baseline tool to compile the true gradle-wrapper.jar..."
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.2.2 --distribution-type bin

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Grant Shell Execution Rights
      run: chmod +x ./gradlew

    - name: Compile and Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        if-no-files-found: error
