name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # OPTIMIZATION: High-speed caching layer for dependencies
    - name: Configure Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Verified Gradle 8.14.5 Toolchain
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.5'

    # STEP 1: Deep path discovery that explicitly targets the inner project directory containing the /app folder
    - name: Auto-Detect True Project Path & Generate Wrapper
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        # Look for a build.gradle file that lives inside a sub-folder, avoiding the absolute root entry
        TARGET_DIR=$(dirname $(find . -mindepth 2 -name "build.gradle" | grep -v "/app/" | head -n 1))
        
        # Fallback if structure changes
        if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
          TARGET_DIR="./BloxFul"
        fi
        
        echo "TARGET_PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV
        echo "Targeting core Android folder layer at: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.14.5 --distribution-type bin
        chmod +x ./gradlew

    # STEP 2: Execute build operations within the isolated inner directory path
    - name: Compile and Assemble Debug APK
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        cd "${{ env.TARGET_PROJECT_PATH }}"
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    # STEP 3: Grab the completed APK file and drop it onto your dashboard
    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
        retention-days: 7
        if-no-files-found: error
