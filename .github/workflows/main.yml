name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # STEP 1: Let the official action provision a pristine Gradle environment automatically
    - name: Setup Gradle Toolchain
      uses: gradle/actions/setup-gradle@v3

    # STEP 2: Force generate clean wrapper files natively inside the runner workspace
    - name: Generate Fresh Wrapper Binaries
      run: gradle wrapper --gradle-version 8.2.2 --distribution-type bin

    # STEP 3: Ensure execution flags are set for the freshly generated script
    - name: Grant Execute Permissions to Gradle
      run: chmod +x ./gradlew

    # STEP 4: Compile your 2014-themed Java layout client
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # STEP 5: Push the compiled package straight to your repo dashboard
    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
