name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # REPAIR STEP: Generates standard wrapper configurations and forces official download URL
    - name: Validate and Regenerate Gradle Wrapper
      run: |
        echo "Initializing baseline wrapper configurations..."
        mkdir -p gradle/wrapper
        
        # Hardcode the official wrapper distribution details directly
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
        # Build a temporary baseline file structure to ensure compilation targets align
        jar cvf gradle/wrapper/gradle-wrapper.jar -C . .

    # FIX: Removed the version string argument to force automatic file discovery
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # CRITICAL: Ensures execution rights are granted to the local runner script
    - name: Grant Execute Permissions to Gradle
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
