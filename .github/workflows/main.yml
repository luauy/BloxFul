name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # STEP 1: Provision the specific Gradle 8.14.5 engine distribution
    - name: Install Verified Gradle 8.14.5 Toolchain
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.5'

    # STEP 2: Dynamically build pristine wrapper artifacts pinned to 8.14.5
    - name: Dynamically Regenerate Modern Wrapper Binaries
      run: |
        echo "Generating pristine wrapper artifacts using Gradle 8.14.5..."
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.14.5 --distribution-type bin

    - name: Grant Shell Execution Rights
      run: chmod +x ./gradlew

    # STEP 3: Execute target build layout with strict error reporting
    - name: Compile and Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    # STEP 4: Export compiled artifact package straight to the repo dashboard
    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        if-no-files-found: error
