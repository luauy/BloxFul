name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # OPTIMIZATION: Cache Gradle packages to drop subsequent build times down significantly
    - name: Configure Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/images/build.gradle*', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Verified Gradle 8.14.5 Toolchain
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.5'

    # STEP 1: Dynamically locate the exact project folder and generate the wrapper binaries natively
    - name: Auto-Detect Project Path & Generate Wrapper
      run: |
        TARGET_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        echo "TARGET_PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV
        echo "Found valid Android configuration directory at: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.14.5 --distribution-type bin
        chmod +x ./gradlew

    # STEP 2: Execute target compile layer inside the auto-detected directory
    - name: Compile and Assemble Debug APK
      run: |
        cd "${{ env.TARGET_PROJECT_PATH }}"
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    # STEP 3: Secure the output file and push it straight to your dashboard panel
    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
        retention-days: 7
        if-no-files-found: error
