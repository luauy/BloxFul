name: Android GitPK CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Engine APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Ensure environment matches modern compiler constraints
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # OPTIMIZATION: High-speed Gradle caching layer to drop compiler latency
    - name: Configure Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Verified Gradle 8.14.5 Toolchain
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.5'

    # STEP 1: Generate clean wrapper structures natively inside the workspace root
    - name: Regenerate Pristine Wrapper Binaries
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.14.5 --distribution-type bin
        chmod +x ./gradlew

    # STEP 2: Fire compiler engine directly targeting your main root source modules
    - name: Compile and Assemble Debug APK
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    # STEP 3: Grab your completed debug package and drop it into the dashboard
    - name: Export Generated Studio Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloxful-studio-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        if-no-files-found: error
